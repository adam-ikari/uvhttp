name: CI - PR Build & Quality

# PR 快速门禁：只做编译 + 代码质量 + 裁剪配置编译验证，**不跑测试**。
# 完整测试矩阵（fast tests / 各配置测试 / ASan 内存安全）移到
# ci-release-gate.yml，仅在发布 pre-release 时触发。
# 触发条件：PR 打开、同步、重新打开到 main 或 develop 分支
on:
  pull_request:
    branches: [ main, develop ]
    types: [opened, synchronize, reopened]

# 并发控制：取消同一 PR 的旧运行
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

# Minimal GITHUB_TOKEN. The repo default is admin/maintain/push/triage — all
# this workflow needs is checkout (contents: read). generate-summary writes
# $GITHUB_STEP_SUMMARY, which is local to the run and needs no scope. The
# benchmark-label job lives in ci-benchmark.yml with its own permissions.
permissions:
  contents: read
jobs:
  # ========== 并行任务组 ==========
  
  # 任务 1: Ubuntu 构建
  ubuntu-build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      build-dir: ${{ steps.build.outputs.build-dir }}
      build-status: ${{ steps.build.outputs.status }}
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v7.0.1
        with:
          submodules: recursive
      
      - name: Setup build environment
        uses: ./.github/actions/setup-build
        with:
          os: ubuntu-latest
      
      - name: Cache dependencies
        uses: ./.github/actions/cache-deps
        with:
          cache-key: pr-${{ github.event.pull_request.number }}
          build-type: Release

      - name: Configure CMake
        run: |
          # BUILD_EXAMPLES=ON：示例纳入 PR 门禁编译（04_static_files 由特性门跳过）
          cmake -B build -DCMAKE_BUILD_TYPE=Release -DBUILD_EXAMPLES=ON

      - name: Build project
        id: build
        run: |
          cd build && make -j$(nproc)
          echo "build-dir=build" >> $GITHUB_OUTPUT
          echo "status=success" >> $GITHUB_OUTPUT
      
      - name: Check for warnings
        run: |
          if cmake --build build --config Release 2>&1 | grep -i "warning:"; then
            echo "Found compiler warnings!"
            exit 1
          fi
      
      - name: Upload build artifacts
        uses: actions/upload-artifact@v7.0.1
        with:
          name: build-ubuntu-pr-${{ github.event.pull_request.number }}
          path: build/dist/
          retention-days: 7
  
  # 任务 2: 代码质量检查（真实 cppcheck 静态分析，任何告警即阻塞 PR 门禁）
  code-quality-check:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout code
        uses: actions/checkout@v7.0.1
        with:
          submodules: recursive

      - name: Setup build environment
        uses: ./.github/actions/setup-build
        with:
          os: ubuntu-latest

      - name: Run cppcheck
        id: cppcheck
        run: |
          # 真实静态分析：--error-exitcode=1 使任何告警都阻塞门禁。
          # 当前 src/ 在此级别零告警（本地验证 18/18 文件通过）。
          # 三个标志消除的是 cppcheck 配置解析产物，而非真实问题：
          #   - toomanyconfigs：information 级提示，默认 12 配置已足够
          #   - UVHTTP_STRINGIFY 在头文件中定义，需显式告知 cppcheck
          #   - 强制 UVHTTP_FEATURE_TLS=1，避免 cppcheck 尝试
          #     WEBSOCKET=ON+TLS=OFF 这一 CMake 永不产出的组合
          #     （该组合在 uvhttp_websocket.c 中有意 #error）
          cppcheck --enable=warning,performance,portability \
            --error-exitcode=1 \
            --suppress=toomanyconfigs \
            -D'UVHTTP_STRINGIFY(x)=#x' \
            -DUVHTTP_FEATURE_TLS=1 \
            --xml --xml-version=2 \
            --output-file=cppcheck-results.xml \
            src/

      # 阻止「恒绿零验证」的测试进入仓库：断言被注释掉、断言被无
      # GTEST_SKIP 的 if 罩住、新增零断言测试（详见脚本 docstring）。
      # 基线来自 2026-10-03 普查，逐项治理后应下调。
      - name: Check test validity (no always-green tests)
        run: python3 scripts/ci/check_test_validity.py --strict

      - name: Upload code quality results
        if: always()
        uses: actions/upload-artifact@v7.0.1
        with:
          name: code-quality-pr-${{ github.event.pull_request.number }}
          path: cppcheck-results.xml
          retention-days: 7
  
  # 任务 3: 快速测试
  doc-sync-check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    if: always()

    steps:
      - name: Checkout code
        uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
          # Check out the PR head, not the synthetic merge ref. The sync check
          # compares EN/ZH commit timestamps; at the merge ref, git reports the
          # merge commit itself as the newest commit touching any PR-modified
          # EN file, which can never be older than ZH and produces false
          # failures. The PR head is what the author tested locally.
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Check EN/ZH doc sync
        id: sync
        run: |
          # Only check if EN docs were changed in this PR
          if git diff --name-only ${{ github.event.before }} ${{ github.event.pull_request.head.sha }} | grep "^docs/.*\.md$" | grep -v "^docs/zh/" | grep -v "/api/" | grep -v "/dev/" | grep -v "/spec/"; then
            echo "EN docs changed — running sync check..."
            bash scripts/check-doc-sync.sh --check
          else
            echo "No EN docs changed in scope — skipping sync check."
          fi

      - name: Generate sync summary
        if: always()
        run: |
          echo "## EN/ZH Doc Sync" >> $GITHUB_STEP_SUMMARY
          bash scripts/check-doc-sync.sh --list >> $GITHUB_STEP_SUMMARY || true

      - name: Check internal links
        run: bash scripts/check-links.sh

      - name: Check brain pages
        run: bash scripts/check-brain.sh

  # ========== 裁剪配置编译验证矩阵 ==========
  # 哲学文档第九节：CI 此前只测默认配置。此 job 用 matrix 验证多个特性组合
  # 均可**编译**（编译时裁剪 / ROUTER_CACHE / 静态文件等）——各 feature 有独立
  # #if 路径，裁剪后才发现编译错已太晚（e.g. PR #464 的 unused-function 只在
  # COMPRESSION=OFF 暴露）。编译验证 ≠ 测试：测试统一在 ci-release-gate.yml。
  build-matrix:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        config:
          - name: all-on
            flags: "-DBUILD_WITH_STATIC_FILES=ON -DBUILD_WITH_ROUTER_CACHE=ON"
          - name: minimal
            description: "核心 HTTP/1.1 最小化（验证编译时裁剪）"
            flags: "-DBUILD_WITH_WEBSOCKET=OFF -DBUILD_WITH_HTTPS=OFF -DBUILD_WITH_STATIC_FILES=OFF -DBUILD_WITH_LRU_CACHE=OFF -DBUILD_WITH_COMPRESSION=OFF"
          - name: router-cache
            flags: "-DBUILD_WITH_ROUTER_CACHE=ON"
          - name: static-files
            flags: "-DBUILD_WITH_STATIC_FILES=ON"
          - name: no-compression
            flags: "-DBUILD_WITH_COMPRESSION=OFF"

    steps:
      - name: Checkout code
        uses: actions/checkout@v7.0.1
        with:
          submodules: recursive

      - name: Setup build environment
        uses: ./.github/actions/setup-build
        with:
          os: ubuntu-latest

      - name: Configure CMake (${{ matrix.config.name }})
        run: |
          cmake -B build-${{ matrix.config.name }} \
            -DCMAKE_BUILD_TYPE=Release \
            ${{ matrix.config.flags }}

      - name: Build (${{ matrix.config.name }})
        run: |
          cd build-${{ matrix.config.name }} && make -j$(nproc)

  # ========== 阶段 2: 生成总结 ==========

  generate-summary:
    needs: [ubuntu-build, code-quality-check, doc-sync-check, build-matrix]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    if: always()
    
    steps:
      - name: Generate summary
        run: |
          echo "## 📊 PR CI/CD Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Build Status" >> $GITHUB_STEP_SUMMARY
          echo "| Platform | Status |" >> $GITHUB_STEP_SUMMARY
          echo "|----------|--------|" >> $GITHUB_STEP_SUMMARY
          echo "| Ubuntu (Linux) | ${{ needs.ubuntu-build.result == 'success' && '✅' || '❌' }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Build Matrix | ${{ needs.build-matrix.result == 'success' && '✅' || '❌' }} |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Code Quality" >> $GITHUB_STEP_SUMMARY
          echo "| Check | Status |" >> $GITHUB_STEP_SUMMARY
          echo "|-------|--------|" >> $GITHUB_STEP_SUMMARY
          echo "| cppcheck | ${{ needs.code-quality-check.result == 'success' && '✅' || '❌' }} |" >> $GITHUB_STEP_SUMMARY
