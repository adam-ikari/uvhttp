name: CI - PR Build & Quality

# PR 快速门禁：只做编译 + 代码质量 + 裁剪配置编译验证，**不跑测试**。
# 完整测试矩阵（fast tests / 各配置测试 / ASan 内存安全）移到
# ci-release-gate.yml，仅在发布 pre-release 时触发。
# 触发条件：PR 打开、同步、重新打开到 main 分支
on:
  pull_request:
    branches: [ main ]
    types: [opened, synchronize, reopened]

# 并发控制：取消同一 PR 的旧运行
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

# Minimal GITHUB_TOKEN. The repo default is admin/maintain/push/triage — all
# this workflow needs is checkout (contents: read). generate-summary writes
# $GITHUB_STEP_SUMMARY, which is local to the run and needs no scope. The
# benchmark gate job lives in ci-benchmark.yml with its own permissions.
permissions:
  contents: read
jobs:
  # ========== 并行任务组 ==========
  
  # 任务 1: Ubuntu 构建
  ubuntu-build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      build-dir: ${{ steps.build.outputs.build-dir }}
      build-status: ${{ steps.build.outputs.status }}
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v7.0.1
        with:
          submodules: recursive
      
      - name: Setup build environment
        uses: ./.github/actions/setup-build
        with:
          os: ubuntu-latest
      
      - name: Cache dependencies
        uses: ./.github/actions/cache-deps
        with:
          cache-key: pr-${{ github.event.pull_request.number }}
          build-type: Release

      - name: Configure CMake
        run: |
          # BUILD_EXAMPLES=ON：示例纳入 PR 门禁编译（04_static_files 由特性门跳过）
          cmake -B build -DCMAKE_BUILD_TYPE=Release -DBUILD_EXAMPLES=ON

      - name: Build project
        id: build
        run: |
          cd build && make -j$(nproc)
          echo "build-dir=build" >> $GITHUB_OUTPUT
          echo "status=success" >> $GITHUB_OUTPUT
      
      - name: Check for warnings
        run: |
          if cmake --build build --config Release 2>&1 | grep -i "warning:"; then
            echo "Found compiler warnings!"
            exit 1
          fi
      
      - name: Upload build artifacts
        uses: actions/upload-artifact@v7.0.2
        with:
          name: build-ubuntu-pr-${{ github.event.pull_request.number }}
          path: build/dist/
          retention-days: 7

  # 任务 1b: macOS 编译验证（跨平台可编译性，不跑测试）
  # PR 门禁本来只编译不测试；macOS runner 自带 cmake + AppleClang，
  # 不需要 setup-build action（那个只支持 Ubuntu）。
  macos-build:
    runs-on: macos-latest
    timeout-minutes: 20
    # macOS runners queue unpredictably and may be cancelled before starting.
    # Keep the check visible without blocking PRs on external capacity.
    continue-on-error: true
    steps:
      - name: Checkout code
        uses: actions/checkout@v7.0.1
        with:
          submodules: recursive

      - name: Configure CMake
        run: cmake -B build -DCMAKE_BUILD_TYPE=Release -DBUILD_EXAMPLES=ON

      - name: Build project
        run: cmake --build build -j$(sysctl -n hw.ncpu)

  # 任务 2: 代码质量检查（真实 cppcheck 静态分析，任何告警即阻塞 PR 门禁）
  code-quality-check:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout code
        uses: actions/checkout@v7.0.1
        with:
          submodules: recursive

      - name: Setup build environment
        uses: ./.github/actions/setup-build
        with:
          os: ubuntu-latest

      - name: Run cppcheck
        id: cppcheck
        run: |
          # 真实静态分析：--error-exitcode=1 使任何告警都阻塞门禁。
          # 当前 src/ 在此级别零告警（本地验证 18/18 文件通过）。
          # 三个标志消除的是 cppcheck 配置解析产物，而非真实问题：
          #   - toomanyconfigs：information 级提示，默认 12 配置已足够
          #   - UVHTTP_STRINGIFY 在头文件中定义，需显式告知 cppcheck
          #   - 强制 UVHTTP_FEATURE_TLS=1，避免 cppcheck 尝试
          #     WEBSOCKET=ON+TLS=OFF 这一 CMake 永不产出的组合
          #     （该组合在 uvhttp_websocket.c 中有意 #error）
          cppcheck --enable=warning,performance,portability \
            --error-exitcode=1 \
            --suppress=toomanyconfigs \
            -D'UVHTTP_STRINGIFY(x)=#x' \
            -DUVHTTP_FEATURE_TLS=1 \
            --xml --xml-version=2 \
            --output-file=cppcheck-results.xml \
            src/

      # 阻止「恒绿零验证」的测试进入仓库：断言被注释掉、断言被无
      # GTEST_SKIP 的 if 罩住、新增零断言测试（详见脚本 docstring）。
      # 基线来自 2026-10-03 普查，逐项治理后应下调。
      - name: Check test validity (no always-green tests)
        run: python3 scripts/ci/check_test_validity.py --strict

      # Response body lengths in examples must be C byte counts, not character
      # counts: a UTF-8 literal like "中间件测试" is 15 bytes, not 5. A wrong
      # number truncates the body or leaves a trailing NUL (JSON.parse fails).
      - name: Check response body lengths (no hand-counted bytes)
        run: python3 scripts/ci/check_response_lengths.py

      - name: Upload code quality results
        if: always()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: code-quality-pr-${{ github.event.pull_request.number }}
          path: cppcheck-results.xml
          retention-days: 7
  
  # 任务 3: 快速测试
  doc-sync-check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    if: always()

    steps:
      - name: Checkout code
        uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
          # Check out the PR head, not the synthetic merge ref. The sync check
          # compares EN/ZH commit timestamps; at the merge ref, git reports the
          # merge commit itself as the newest commit touching any PR-modified
          # EN file, which can never be older than ZH and produces false
          # failures. The PR head is what the author tested locally.
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Check EN/ZH doc sync
        id: sync
        run: |
          # Only check if EN docs were changed in this PR
          if git diff --name-only ${{ github.event.before }} ${{ github.event.pull_request.head.sha }} | grep "^docs/.*\.md$" | grep -v "^docs/zh/" | grep -v "/api/" | grep -v "/dev/" | grep -v "/spec/"; then
            echo "EN docs changed — running sync check..."
            bash scripts/check-doc-sync.sh --check
          else
            echo "No EN docs changed in scope — skipping sync check."
          fi

      - name: Generate sync summary
        if: always()
        run: |
          echo "## EN/ZH Doc Sync" >> $GITHUB_STEP_SUMMARY
          bash scripts/check-doc-sync.sh --list >> $GITHUB_STEP_SUMMARY || true

      - name: Check internal links
        run: bash scripts/check-links.sh

      - name: Check brain pages
        run: bash scripts/check-brain.sh

  # ========== 裁剪配置编译验证矩阵 ==========
  # 哲学文档第九节：CI 此前只测默认配置。此 job 用 matrix 验证多个特性组合
  # 均可**编译**（编译时裁剪 / ROUTER_CACHE / 静态文件等）——各 feature 有独立
  # #if 路径，裁剪后才发现编译错已太晚（e.g. PR #464 的 unused-function 只在
  # COMPRESSION=OFF 暴露）。编译验证 ≠ 测试：测试统一在 ci-release-gate.yml。
  build-matrix:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        config:
          - name: all-on
            flags: "-DBUILD_WITH_STATIC_FILES=ON -DBUILD_WITH_ROUTER_CACHE=ON"
          - name: minimal
            description: "核心 HTTP/1.1 最小化（验证编译时裁剪）"
            flags: "-DBUILD_WITH_WEBSOCKET=OFF -DBUILD_WITH_HTTPS=OFF -DBUILD_WITH_STATIC_FILES=OFF -DBUILD_WITH_COMPRESSION=OFF"
          - name: router-cache
            flags: "-DBUILD_WITH_ROUTER_CACHE=ON"
          - name: static-files
            flags: "-DBUILD_WITH_STATIC_FILES=ON"
          - name: no-compression
            flags: "-DBUILD_WITH_COMPRESSION=OFF"

    steps:
      - name: Checkout code
        uses: actions/checkout@v7.0.1
        with:
          submodules: recursive

      - name: Setup build environment
        uses: ./.github/actions/setup-build
        with:
          os: ubuntu-latest

      - name: Configure CMake (${{ matrix.config.name }})
        run: |
          cmake -B build-${{ matrix.config.name }} \
            -DCMAKE_BUILD_TYPE=Release \
            ${{ matrix.config.flags }}

      - name: Build (${{ matrix.config.name }})
        run: |
          cd build-${{ matrix.config.name }} && make -j$(nproc)

  # ========== 32-bit 架构门禁 ==========
  # 32-bit 是发布前提，不是手动验证项：库源码、vendored 依赖、测试套件与
  # 最小消费者链接全部必须在 i386 下端到端成立。
  # 关键点：deps/* 的预编译产物不进 git，checkout 后是干净源码；所有 flags
  # 必须同时传给 C/CXX 编译器与链接器，否则依赖产出 64 位归档、链接阶段
  # 出现 "i386 architecture ... incompatible with i386:x86-64 output"。
  # 不用 cache-deps：那会跨架构复用 64 位产物，污染本 job。
  build-32bit:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout code
        uses: actions/checkout@v7.0.1
        with:
          submodules: recursive

      - name: Install 32-bit toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-multilib g++-multilib

      - name: Configure CMake (i386)
        run: |
          cmake -B build-32bit \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_C_FLAGS=-m32 \
            -DCMAKE_CXX_FLAGS=-m32 \
            -DCMAKE_EXE_LINKER_FLAGS=-m32

      - name: Build project (i386)
        run: cmake --build build-32bit -j$(nproc)

      - name: Verify library is 32-bit
        run: |
          file build-32bit/dist/lib/libuvhttp.a
          objdump -f build-32bit/CMakeFiles/uvhttp.dir/src/uvhttp_server.c.o \
            | grep -q 'architecture: i386'
          echo "libuvhttp.a object code is i386"

      - name: Run tests (i386)
        run: ctest --test-dir build-32bit --output-on-failure -j4

      - name: Link and run a 32-bit consumer
        run: |
          cat > /tmp/consumer32.c <<'EOF'
          #include <uvhttp.h>
          #include <stdio.h>
          int main(void) {
              printf("version=%s sizeof_server=%zu\n",
                     uvhttp_get_version_string(), sizeof(uvhttp_server_t));
              return 0;
          }
          EOF
          gcc -m32 /tmp/consumer32.c -o /tmp/consumer32 \
            -Iinclude -Ideps/libuv/include -Ideps/llhttp/include \
            -Ideps/uthash/src -Ideps/mbedtls/include -Ideps/cjson \
            build-32bit/dist/lib/libuvhttp.a \
            deps/libuv/build/libuv.a \
            deps/llhttp/build/libllhttp.a \
            build-32bit/dist/lib/libminiz.a \
            deps/xxhash/libxxhash.a \
            deps/cjson/build/libcjson.a \
            deps/mbedtls/build/library/libmbedtls.a \
            deps/mbedtls/build/library/libmbedx509.a \
            deps/mbedtls/build/library/libmbedcrypto.a \
            -lpthread -lm -ldl
          file /tmp/consumer32 | grep -q 'ELF 32-bit'
          /tmp/consumer32

  # ========== 阶段 2: 生成总结 ==========

  generate-summary:
    needs: [ubuntu-build, code-quality-check, doc-sync-check, build-matrix, build-32bit]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    if: always()
    
    steps:
      - name: Generate summary
        run: |
          echo "## 📊 PR CI/CD Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Build Status" >> $GITHUB_STEP_SUMMARY
          echo "| Platform | Status |" >> $GITHUB_STEP_SUMMARY
          echo "|----------|--------|" >> $GITHUB_STEP_SUMMARY
          echo "| Ubuntu (Linux) | ${{ needs.ubuntu-build.result == 'success' && '✅' || '❌' }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Build Matrix | ${{ needs.build-matrix.result == 'success' && '✅' || '❌' }} |" >> $GITHUB_STEP_SUMMARY
          echo "| 32-bit (i386) | ${{ needs.build-32bit.result == 'success' && '✅' || '❌' }} |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Code Quality" >> $GITHUB_STEP_SUMMARY
          echo "| Check | Status |" >> $GITHUB_STEP_SUMMARY
          echo "|-------|--------|" >> $GITHUB_STEP_SUMMARY
          echo "| cppcheck | ${{ needs.code-quality-check.result == 'success' && '✅' || '❌' }} |" >> $GITHUB_STEP_SUMMARY
