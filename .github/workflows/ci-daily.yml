name: CI/CD - Daily Build

on:
  schedule:
    - cron: '0 20 * * *'  # UTC 20:00 = 北京时间 04:00 (凌晨)
  workflow_dispatch:

jobs:
  daily-build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4.1.1
        with:
          submodules: recursive

      - name: Configure CMake
        run: cmake -B build -DCMAKE_BUILD_TYPE=Debug

      - name: Build
        run: cmake --build build -j$(nproc)

      - name: Run tests
        run: |
          cd build
          ctest --output-on-failure > test-results.txt 2>&1
          echo "test_exit_code=$?" >> $GITHUB_ENV

      - name: Check for failures
        id: check
        run: |
          if [ "${{ env.test_exit_code }}" != "0" ]; then
            echo "has_failures=true" >> $GITHUB_OUTPUT
            echo "failure_count=$(grep -c 'FAILED' build/test-results.txt 2>/dev/null || echo 0)" >> $GITHUB_OUTPUT
          else
            echo "has_failures=false" >> $GITHUB_OUTPUT
          fi

      - name: Create issue for failed tests
        if: steps.check.outputs.has_failures == 'true'
        uses: actions/github-script@v9
        with:
          script: |
            const failures = `${{ steps.check.outputs.failure_count }}`;
            const body = `## Daily Build Failed\n\nDate: ${new Date().toISOString()}\nFailures: ${failures}\n\nSee workflow: ${context.serverUrl}/${context.repo}/actions/runs/${context.runId}`;
            await github.rest.issues.create({
              owner: context.repoOwner,
              repo: context.repo,
              title: `[daily-build] ${failures} test(s) failed on ${new Date().toISOString().split('T')[0]}`,
              body: body,
              labels: ['bug', 'daily-build']
            });

      - name: Log success
        if: steps.check.outputs.has_failures == 'false'
        run: |
          echo "Daily build passed: all tests green"
          echo "skip_issue_creation=true" >> $GITHUB_ENV