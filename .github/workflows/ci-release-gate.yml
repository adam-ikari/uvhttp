name: CI - Pre-Release Test Gate

# 发布前完整测试门禁：仅在创建 pre-release 时触发
# （gh release create vX.Y.Z --prerelease），以及手动触发。
#
# 背景：PR 阶段（ci-pr.yml）只做编译 + 质量 + 裁剪配置编译验证，不跑测试——
# 避免每次 PR 都重复跑完整测试矩阵浪费 CI 资源。完整测试（fast tests /
# 各配置测试 / ASan 内存安全）集中在此，pre-release 必须全绿才能转正式发布。
#
# PR 阶段保留裁剪配置编译（build-matrix）的原因：compile-time feature 裁剪
# 是本项目的高危面（各 feature 有独立 #if 路径，裁剪后才发现编译错已太晚，
# e.g. PR #464 的 unused-function 只在 COMPRESSION=OFF 暴露）。编译验证 ≠ 测试。
on:
  release:
    # 'published' covers both stable releases and pre-releases. Do not use
    # 'prereleased': it does not fire for pre-releases published from a draft,
    # which is how `gh release create --prerelease` publishes — v3.0.0
    # produced no run under it. 'released' fires only on the later --latest
    # promotion, after this gate should already have run.
    types: [published]
  workflow_dispatch:

env:
  # The gate builds the tag's source, and v3.0.0 predates the cJSON policy
  # fix. CMake 4 rejects vendored cJSON's cmake_minimum_required(VERSION 3.0);
  # the environment variable initialises the cache entry in every new build
  # tree, including the nested configure Dependencies.cmake spawns via
  # execute_process. Ignored by CMake < 4.
  CMAKE_POLICY_VERSION_MINIMUM: "3.5"

permissions:
  contents: read

jobs:
  # ========== 编译 ==========
  ubuntu-build:
    # Nightly also publishes a prerelease; it is not a release candidate, and
    # ci-nightly.yml already covers it. Matches the benchmark workflow's guard
    # (in practice GITHUB_TOKEN-created nightly releases never fire workflows;
    # this covers a user-token publish).
    if: github.event_name != 'release' || !startsWith(github.event.release.tag_name, 'nightly')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      build-status: ${{ steps.build.outputs.status }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v7.0.1
        with:
          submodules: recursive

      - name: Setup build environment
        uses: ./.github/actions/setup-build
        with:
          os: ubuntu-latest

      - name: Cache dependencies
        uses: ./.github/actions/cache-deps
        with:
          cache-key: release-${{ github.event.release.tag_name || github.run_id }}
          build-type: Release

      - name: Configure CMake
        run: |
          cmake -B build -DCMAKE_BUILD_TYPE=Release -DBUILD_EXAMPLES=ON

      - name: Build project
        id: build
        run: |
          cd build && make -j$(nproc)
          echo "status=success" >> $GITHUB_OUTPUT

      - name: Upload build artifacts
        uses: actions/upload-artifact@v7.0.2
        with:
          name: build-release-${{ github.event.release.tag_name || github.run_id }}
          path: build/dist/
          retention-days: 7

  # ========== 快速测试（默认配置） ==========
  ubuntu-test-fast:
    needs: [ubuntu-build]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      test-status: ${{ steps.test.outputs.status }}
      test-total: ${{ steps.test.outputs.total }}
      test-passed: ${{ steps.test.outputs.passed }}
      test-failed: ${{ steps.test.outputs.failed }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v7.0.1
        with:
          submodules: recursive

      - name: Download build artifacts
        uses: actions/download-artifact@v8.0.2
        with:
          name: build-release-${{ github.event.release.tag_name || github.run_id }}
          path: build/

      - name: Set executable permissions
        run: |
          chmod +x build/dist/bin/* || true

      - name: Run fast tests
        id: test
        uses: ./.github/actions/run-tests
        with:
          build-dir: build
          test-type: fast
          timeout: 60
          parallel: $(nproc)

      - name: Upload test logs
        if: always()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: test-logs-release-${{ github.event.release.tag_name || github.run_id }}
          path: build/Testing/
          retention-days: 7

  # ========== 各配置矩阵（编译 + 测试） ==========
  build-matrix:
    if: github.event_name != 'release' || !startsWith(github.event.release.tag_name, 'nightly')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        config:
          - name: all-on
            flags: "-DBUILD_WITH_STATIC_FILES=ON -DBUILD_WITH_ROUTER_CACHE=ON"
            run-tests: true
          - name: minimal
            description: "核心 HTTP/1.1 最小化（验证编译时裁剪）"
            flags: "-DBUILD_WITH_WEBSOCKET=OFF -DBUILD_WITH_HTTPS=OFF -DBUILD_WITH_STATIC_FILES=OFF -DBUILD_WITH_COMPRESSION=OFF -DBUILD_WITH_MIMALLOC=OFF"
            run-tests: true
          - name: router-cache
            flags: "-DBUILD_WITH_ROUTER_CACHE=ON"
            run-tests: true
          - name: static-files
            flags: "-DBUILD_WITH_STATIC_FILES=ON"
            run-tests: true
          - name: no-compression
            flags: "-DBUILD_WITH_COMPRESSION=OFF"
            run-tests: true

    steps:
      - name: Checkout code
        uses: actions/checkout@v7.0.1
        with:
          submodules: recursive

      - name: Setup build environment
        uses: ./.github/actions/setup-build
        with:
          os: ubuntu-latest

      - name: Configure CMake (${{ matrix.config.name }})
        run: |
          cmake -B build-${{ matrix.config.name }} \
            -DCMAKE_BUILD_TYPE=Release \
            ${{ matrix.config.flags }}

      - name: Build (${{ matrix.config.name }})
        run: |
          cd build-${{ matrix.config.name }} && make -j$(nproc)

      - name: Run fast tests (${{ matrix.config.name }})
        if: matrix.config.run-tests
        uses: ./.github/actions/run-tests
        with:
          build-dir: build-${{ matrix.config.name }}
          test-type: fast
          timeout: 60
          parallel: $(nproc)

  # ========== 响应体长度门禁 ==========
  # examples 的 body 长度必须是 C 字符串字节数（UTF-8 中文按字节），
  # 手数字符数会截断响应或留尾随 NUL —— 与 PR 门禁同一脚本。
  response-length-check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout code
        uses: actions/checkout@v7.0.1
        with:
          submodules: recursive
      - name: Check response body lengths
        run: python3 scripts/ci/check_response_lengths.py

  # ========== ASan 内存安全门禁 ==========
  # 内存安全是不可回退的不变量。此处跑完整 ASan 套件（此前 PR 阶段只跑快速
  # 子集，现全部集中到 pre-release）。完整 ASan+UBSan 仍由 ci-nightly.yml 覆盖。
  asan-gate:
    needs: [ubuntu-build]
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout code
        uses: actions/checkout@v7.0.1
        with:
          submodules: recursive

      - name: Configure with AddressSanitizer
        run: |
          # ENABLE_ASAN keeps debug symbols (no strip) so findings are debuggable.
          # BUILD_WITH_STATIC_FILES=ON is required for coverage, not optional
          # tuning. It defaults to OFF, which left src/uvhttp_static.c and
          # src/uvhttp_lru_cache.c out of the build entirely — so the ASan gate
          # never saw uvhttp_static_resolve_safe_path (the path-traversal
          # guard), and the 8 static/LRU test binaries ran 0 test cases while
          # still reporting PASS. Turning it on immediately surfaced three real
          # defects the gate had been blind to (PR #449).
          cmake -B build-asan -DCMAKE_BUILD_TYPE=Debug -DENABLE_ASAN=ON \
            -DBUILD_WITH_STATIC_FILES=ON -DBUILD_WITH_ROUTER_CACHE=ON
          cmake --build build-asan -j$(nproc)

      - name: Run tests under ASan (memory-safety gate)
        uses: ./.github/actions/run-tests
        with:
          build-dir: build-asan
          test-type: memory
          timeout: 120
          parallel: 1

      - name: Upload ASan test results
        if: always()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: asan-gate-release-${{ github.event.release.tag_name || github.run_id }}
          path: build-asan/Testing/
          retention-days: 7

  # ========== 32-bit 架构门禁 ==========
  # 32-bit 是发布前提：pre-release 必须在 i386 下端到端验证库、依赖、
  # 测试套件与最小消费者链接。与 ci-pr.yml 的同名 job 保持同一套步骤；
  # 不使用 cache-deps（跨架构复用 64 位产物会污染），deps 产物不进 git，
  # checkout 即干净源码，由 CMake 用 -m32 重建。
  build-32bit:
    if: github.event_name != 'release' || !startsWith(github.event.release.tag_name, 'nightly')
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout code
        uses: actions/checkout@v7.0.1
        with:
          submodules: recursive

      - name: Install 32-bit toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-multilib g++-multilib

      - name: Configure CMake (i386)
        run: |
          cmake -B build-32bit \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_C_FLAGS=-m32 \
            -DCMAKE_CXX_FLAGS=-m32 \
            -DCMAKE_EXE_LINKER_FLAGS=-m32

      - name: Build project (i386)
        run: cmake --build build-32bit -j$(nproc)

      - name: Verify library is 32-bit
        run: |
          file build-32bit/dist/lib/libuvhttp.a
          objdump -f build-32bit/CMakeFiles/uvhttp.dir/src/uvhttp_server.c.o \
            | grep -q 'architecture: i386'
          echo "libuvhttp.a object code is i386"

      - name: Run tests (i386)
        run: ctest --test-dir build-32bit --output-on-failure -j4

      - name: Link and run a 32-bit consumer
        run: |
          cat > /tmp/consumer32.c <<'EOF'
          #include <uvhttp.h>
          #include <stdio.h>
          int main(void) {
              printf("version=%s sizeof_server=%zu\n",
                     uvhttp_get_version_string(), sizeof(uvhttp_server_t));
              return 0;
          }
          EOF
          gcc -m32 /tmp/consumer32.c -o /tmp/consumer32 \
            -Iinclude -Ideps/libuv/include -Ideps/llhttp/include \
            -Ideps/uthash/src -Ideps/mbedtls/include -Ideps/cjson \
            build-32bit/dist/lib/libuvhttp.a \
            deps/libuv/build/libuv.a \
            deps/llhttp/build/libllhttp.a \
            build-32bit/dist/lib/libminiz.a \
            deps/xxhash/libxxhash.a \
            deps/cjson/build/libcjson.a \
            deps/mbedtls/build/library/libmbedtls.a \
            deps/mbedtls/build/library/libmbedx509.a \
            deps/mbedtls/build/library/libmbedcrypto.a \
            -lpthread -lm -ldl
          file /tmp/consumer32 | grep -q 'ELF 32-bit'
          /tmp/consumer32

  # ========== 汇总 ==========
  generate-summary:
    needs: [ubuntu-build, ubuntu-test-fast, build-matrix, asan-gate, build-32bit, response-length-check]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    # always() keeps the summary on gate failures; the release guard keeps a
    # nightly release from running any jobs (the run itself still exists, with
    # a 'skipped' conclusion — see ubuntu-build).
    if: always() && (github.event_name != 'release' || !startsWith(github.event.release.tag_name, 'nightly'))

    steps:
      - name: Generate summary
        run: |
          echo "## 🧪 Pre-Release Test Gate" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Gate | Status |" >> $GITHUB_STEP_SUMMARY
          echo "|------|--------|" >> $GITHUB_STEP_SUMMARY
          echo "| Build | ${{ needs.ubuntu-build.result == 'success' && '✅' || '❌' }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Fast Tests (default) | ${{ needs.ubuntu-test-fast.result == 'success' && '✅' || '❌' }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Build Matrix (per-config tests) | ${{ needs.build-matrix.result == 'success' && '✅' || '❌' }} |" >> $GITHUB_STEP_SUMMARY
          echo "| ASan memory-safety | ${{ needs.asan-gate.result == 'success' && '✅' || '❌' }} |" >> $GITHUB_STEP_SUMMARY
          echo "| 32-bit (i386) | ${{ needs.build-32bit.result == 'success' && '✅' || '❌' }} |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Tests: ${{ needs.ubuntu-test-fast.outputs.test-passed || 'N/A' }} passed / ${{ needs.ubuntu-test-fast.outputs.test-total || 'N/A' }} total" >> $GITHUB_STEP_SUMMARY