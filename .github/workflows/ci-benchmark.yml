name: CI - Performance Benchmark

# Trigger: manual, PR with 'benchmark' label, or release published
# release event = regression benchmark gate before official release
on:
  workflow_dispatch:
    inputs:
      rounds:
        description: 'Number of rounds per endpoint'
        required: false
        default: '10'
      duration:
        description: 'Duration per round (seconds)'
        required: false
        default: '10'
      endpoints:
        description: 'Endpoints to test (comma-separated: /,/json,/large,/sse,/stream)'
        required: false
        default: '/,/json,/large,/sse,/stream'
      base_ref:
        description: 'Base revision for the paired gate (tag/sha/branch; empty = previous release or PR base)'
        required: false
        default: ''
  pull_request:
    types: [labeled, opened, synchronize, reopened]
    branches: [main]
  release:
    types: [published]

jobs:
  benchmark:
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'release' || contains(join(github.event.pull_request.labels.*.name, ','), 'benchmark')
    runs-on: ubuntu-latest
    timeout-minutes: 50
    # The repo default is read-only, which silently killed the PR comment and
    # the trend commit. contents stays read here: this job builds PR-head code,
    # so it must not hold a token that can write the repository. The only job
    # that pushes (trend data, release events only) is a separate job.
    permissions:
      contents: read
      issues: write
      pull-requests: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v7.0.1
        with:
          submodules: recursive

      - name: Setup build environment
        uses: ./.github/actions/setup-build
        with:
          os: ubuntu-latest

      - name: Build (Release)
        run: |
          cmake -B build -DCMAKE_BUILD_TYPE=Release -DBUILD_BENCHMARKS=ON -DBUILD_EXAMPLES=OFF
          cmake --build build -j$(nproc)

      # The gate compares head against base on THIS runner. GitHub-hosted
      # runners vary ~40% between runs on these endpoints (within-run CV stays
      # under 5%), so an absolute RPS baseline gates runner luck, not code.
      - name: Resolve comparison base
        id: base
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          INPUT_BASE: ${{ github.event.inputs.base_ref }}
        run: |
          REF=""
          case "$EVENT_NAME" in
            pull_request) REF="$PR_BASE_SHA" ;;
            workflow_dispatch) REF="$INPUT_BASE" ;;
            release) REF="" ;;
          esac
          if [ -z "$REF" ] && [ "$EVENT_NAME" = "release" ]; then
            # Newest published release that is not the one being gated.
            REF=$(gh api "repos/$GITHUB_REPOSITORY/releases?per_page=100" | python3 -c 'import json,os,sys; rs=json.load(sys.stdin); cur=os.environ["RELEASE_TAG"]; print(next((r["tag_name"] for r in rs if not r.get("draft") and r.get("tag_name") != cur), ""))')
          fi
          if [ -z "$REF" ]; then
            echo "paired=false" >> "$GITHUB_OUTPUT"
            echo "No base revision resolved; gate falls back to absolute baseline"
            exit 0
          fi
          # Reject anything that is not a ref/name this repo actually has before
          # handing it to checkout.
          if ! git ls-remote --exit-code --heads --tags origin "$REF" > /dev/null 2>&1 \
             && ! echo "$REF" | grep -Eq '^[0-9a-fA-F]{7,40}$'; then
            echo "paired=false" >> "$GITHUB_OUTPUT"
            echo "Unusable base ref: $REF; gate falls back to absolute baseline"
            exit 0
          fi
          {
            echo "paired=true"
            echo "ref=$REF"
          } >> "$GITHUB_OUTPUT"
          echo "Paired gate base: $REF"

      - name: Checkout base revision
        if: steps.base.outputs.paired == 'true'
        uses: actions/checkout@v7.0.1
        with:
          # A resolved ref from the step above (PR base sha, previous release
          # tag, or an explicitly dispatched ref) — never raw event payload.
          ref: ${{ steps.base.outputs.ref }}
          repository: ${{ github.repository }}
          path: bench-base
          submodules: recursive

      - name: Build base (Release)
        if: steps.base.outputs.paired == 'true'
        run: |
          cmake -S bench-base -B bench-base/build -DCMAKE_BUILD_TYPE=Release \
            -DBUILD_BENCHMARKS=ON -DBUILD_EXAMPLES=OFF
          cmake --build bench-base/build -j$(nproc)

      - name: Collect environment info
        run: |
          echo "## CI Runner Environment" > benchmark-env.md
          echo "" >> benchmark-env.md
          echo "| Item | Value |" >> benchmark-env.md
          echo "|------|-------|" >> benchmark-env.md
          echo "| OS | $(lsb_release -ds 2>/dev/null || cat /etc/os-release | grep PRETTY_NAME | cut -d= -f2 | tr -d '"') |" >> benchmark-env.md
          echo "| Kernel | $(uname -r) |" >> benchmark-env.md
          echo "| Architecture | $(uname -m) |" >> benchmark-env.md
          CPU_MODEL=$(grep -m1 'model name' /proc/cpuinfo | cut -d: -f2 | sed 's/^ //')
          CPU_CORES=$(nproc)
          CPU_SOCKETS=$(lscpu | grep 'Socket(s)' | awk '{print $2}' 2>/dev/null || echo 1)
          CPU_THREADS=$(lscpu | grep 'Thread(s) per core' | awk '{print $4}' 2>/dev/null || echo 1)
          echo "| CPU Model | ${CPU_MODEL} |" >> benchmark-env.md
          echo "| CPU Cores | ${CPU_CORES} |" >> benchmark-env.md
          echo "| CPU Sockets | ${CPU_SOCKETS} |" >> benchmark-env.md
          echo "| Threads/Core | ${CPU_THREADS} |" >> benchmark-env.md
          CPU_MHZ=$(grep -m1 'cpu MHz' /proc/cpuinfo | cut -d: -f2 | sed 's/^ //' | cut -d. -f1)
          echo "| CPU Frequency | ${CPU_MHZ} MHz |" >> benchmark-env.md
          MEM_TOTAL=$(grep MemTotal /proc/meminfo | awk '{print $2}')
          echo "| Memory | $((MEM_TOTAL / 1024)) MB |" >> benchmark-env.md
          echo "| Compiler | $(gcc --version | head -1) |" >> benchmark-env.md
          echo "| CMake | $(cmake --version | head -1) |" >> benchmark-env.md
          echo "| wrk | $(wrk --version 2>&1 | head -1) |" >> benchmark-env.md
          echo "| Build Type | Release |" >> benchmark-env.md
          echo "| Build Options | -DBUILD_BENCHMARKS=ON -DBUILD_EXAMPLES=OFF |" >> benchmark-env.md
          echo "| Binary | benchmark_unified (port 18081) |" >> benchmark-env.md
          echo "" >> benchmark-env.md
          cat benchmark-env.md

      - name: Run benchmark
        env:
          ROUNDS: ${{ github.event.inputs.rounds || '10' }}
          DURATION: ${{ github.event.inputs.duration || '10' }}
          ENDPOINTS: ${{ github.event.inputs.endpoints || '/,/json,/large,/sse,/stream' }}
        run: |
          chmod +x build/dist/bin/benchmark_unified
          build/dist/bin/benchmark_unified > /tmp/server.log 2>&1 &
          SERVER_PID=$!
          sleep 3
          if ! kill -0 $SERVER_PID 2>/dev/null; then
            echo "ERROR: server failed to start"
            cat /tmp/server.log
            exit 1
          fi
          curl -s -o /dev/null -w "Health: %{http_code}\n" http://localhost:18081/health

          IFS=',' read -ra EPS <<< "$ENDPOINTS"

          echo "## Performance Benchmark Results" > benchmark-results.md
          echo "" >> benchmark-results.md
          echo "**Date**: $(date -u +%Y-%m-%dT%H:%M:%SZ)" >> benchmark-results.md
          echo "**Runner**: ubuntu-latest (GitHub Actions)" >> benchmark-results.md
          echo "**Rounds**: $ROUNDS x ${DURATION}s per endpoint" >> benchmark-results.md
          echo "**Build**: Release" >> benchmark-results.md
          echo "" >> benchmark-results.md
          echo "endpoint,round,rps,avg_latency,p99_latency" > benchmark-raw.csv

          for ep in "${EPS[@]}"; do
            echo "### Endpoint: $ep" >> benchmark-results.md
            echo "" >> benchmark-results.md
            echo "| Round | RPS | Avg Latency | P99 Latency |" >> benchmark-results.md
            echo "|-------|-----|------------|-------------|" >> benchmark-results.md

            RPS_VALUES=""
            for i in $(seq 1 "$ROUNDS"); do
              result=$(wrk -t2 -c10 -d${DURATION}s "http://localhost:18081${ep}" 2>/dev/null)
              rps=$(echo "$result" | grep "Requests/sec" | awk '{print $2}')
              avg_lat=$(echo "$result" | grep "Latency" | head -1 | awk '{print $2}')
              p99_lat=$(echo "$result" | awk '/^ *99%/{print $2; exit}')
              echo "| $i | $rps | $avg_lat | $p99_lat |" >> benchmark-results.md
              echo "${ep},${i},${rps},${avg_lat},${p99_lat}" >> benchmark-raw.csv
              RPS_VALUES="${RPS_VALUES}${rps} "
            done

            STATS=$(python3 -c "import statistics; vals=[float(x) for x in '${RPS_VALUES}'.strip().split()]; n=len(vals); median=statistics.median(vals); mean=statistics.mean(vals); stdev=statistics.stdev(vals) if n>1 else 0; min_v=min(vals); max_v=max(vals); peak=statistics.median(vals[:3]) if n>=3 else max_v; steady=statistics.median(vals[-7:]) if n>=7 else median; cv=(stdev/mean*100) if mean>0 else 0; print(f'| **Median** | {median:.0f} | | |'); print(f'| **Mean** | {mean:.0f} | CV={cv:.1f}% | |'); print(f'| **Min** | {min_v:.0f} | | |'); print(f'| **Max** | {max_v:.0f} | | |'); print(f'| **Peak (first 3 median)** | {peak:.0f} | | |'); print(f'| **Steady (last 7 median)** | {steady:.0f} | | |')")
            echo "$STATS" >> benchmark-results.md
            echo "" >> benchmark-results.md
            echo "=== $ep ==="
            echo "RPS values: $RPS_VALUES"
            echo "$STATS"
            echo ""
          done

          # WebSocket benchmark — wrk cannot speak RFC 6455, so a dedicated
          # stdlib-only client drives the /ws echo endpoint. It appends
          # /ws_connect (connection establishment) and /ws_echo (message echo
          # throughput) rows to benchmark-raw.csv in the same CSV format, and
          # prints a human summary into the markdown report.
          echo "### WebSocket Benchmark" >> benchmark-results.md
          echo "" >> benchmark-results.md
          echo '```' >> benchmark-results.md
          python3 benchmark/ws_benchmark_client.py --host 127.0.0.1 --port 18081 \
            --connections 10 --messages 200 --rounds 3 --csv benchmark-raw.csv | tee -a benchmark-results.md
          echo '```' >> benchmark-results.md
          echo "" >> benchmark-results.md

          echo "### High Concurrency (1000 connections)" >> benchmark-results.md
          echo "" >> benchmark-results.md
          echo "| Round | RPS | Avg Latency | Errors |" >> benchmark-results.md
          echo "|-------|-----|------------|--------|" >> benchmark-results.md
          for i in $(seq 1 3); do
            result=$(wrk -t4 -c1000 -d${DURATION}s "http://localhost:18081/" 2>/dev/null)
            rps=$(echo "$result" | grep "Requests/sec" | awk '{print $2}')
            avg_lat=$(echo "$result" | grep "Latency" | head -1 | awk '{print $2}')
            errors=$(echo "$result" | grep -i "socket errors\|non-2xx" | head -1 || echo "0")
            echo "| $i | $rps | $avg_lat | $errors |" >> benchmark-results.md
            echo "high_concurrency,${i},${rps},${avg_lat},n/a" >> benchmark-raw.csv
          done

          echo "" >> benchmark-results.md
          echo "---" >> benchmark-results.md
          echo "*Generated by ci-benchmark.yml*" >> benchmark-results.md
          echo "" >> benchmark-results.md
          cat benchmark-env.md >> benchmark-results.md

          kill $SERVER_PID 2>/dev/null
          wait $SERVER_PID 2>/dev/null || true
          cat benchmark-results.md

      # Paired gate: head and base alternate round by round on the same runner,
      # both servers resident so neither pays a restart. Same wrk settings as the
      # report above (-t2 -c10) — only the A/B structure differs.
      - name: Run paired gate benchmark
        if: steps.base.outputs.paired == 'true'
        env:
          GATE_ENDPOINTS: '/,/json,/large'
          PAIR_ROUNDS: '10'
          DURATION: ${{ github.event.inputs.duration || '10' }}
        run: |
          HEAD_BIN=build/dist/bin/benchmark_unified
          BASE_BIN=bench-base/build/dist/bin/benchmark_unified
          HEAD_PORT=18081
          BASE_PORT=18082
          chmod +x "$HEAD_BIN" "$BASE_BIN"

          for f in head-paired.csv base-paired.csv; do
            echo "endpoint,round,rps,avg_latency,p99_latency" > "$f"
          done

          "$HEAD_BIN" "$HEAD_PORT" > /tmp/head-server.log 2>&1 &
          HEAD_PID=$!
          "$BASE_BIN" "$BASE_PORT" > /tmp/base-server.log 2>&1 &
          BASE_PID=$!
          sleep 3
          for pid in "$HEAD_PID" "$BASE_PID"; do
            if ! kill -0 "$pid" 2>/dev/null; then
              echo "ERROR: paired benchmark server failed to start"
              cat /tmp/head-server.log /tmp/base-server.log
              exit 1
            fi
          done

          EPS=$(echo "$GATE_ENDPOINTS" | tr ',' ' ')
          for ep in $EPS; do
            for port in "$HEAD_PORT" "$BASE_PORT"; do
              code=$(curl -s -o /dev/null -w "%{http_code}" "http://localhost:${port}${ep}")
              if [ "$code" != "200" ]; then
                echo "ERROR: $ep returned $code on port $port — paired gate needs both sides"
                cat /tmp/head-server.log /tmp/base-server.log
                exit 1
              fi
              wrk -t2 -c10 -d3s "http://localhost:${port}${ep}" > /dev/null 2>&1 || true
            done
          done

          for ep in $EPS; do
            for i in $(seq 1 "$PAIR_ROUNDS"); do
              # Odd rounds load head first, even rounds load base first, so any
              # within-pair ordering effect falls on both variants equally.
              if [ $((i % 2)) -eq 0 ]; then
                ORDER="base head"
              else
                ORDER="head base"
              fi
              for variant in $ORDER; do
                if [ "$variant" = head ]; then
                  port="$HEAD_PORT"
                else
                  port="$BASE_PORT"
                fi
                result=$(wrk -t2 -c10 -d"${DURATION}s" "http://localhost:${port}${ep}" 2>/dev/null)
                rps=$(echo "$result" | grep "Requests/sec" | awk '{print $2}')
                avg_lat=$(echo "$result" | grep "Latency" | head -1 | awk '{print $2}')
                p99_lat=$(echo "$result" | awk '/^ *99%/{print $2; exit}')
                if [ -z "$rps" ]; then
                  echo "ERROR: no RPS for $ep $variant round $i"
                  cat /tmp/head-server.log /tmp/base-server.log
                  exit 1
                fi
                echo "${ep},${i},${rps},${avg_lat},${p99_lat}" >> "${variant}-paired.csv"
              done
            done
          done

          kill "$HEAD_PID" "$BASE_PID" 2>/dev/null || true
          wait "$HEAD_PID" "$BASE_PID" 2>/dev/null || true
          echo "Paired samples collected:"
          tail -n +2 head-paired.csv | cut -d, -f1 | sort | uniq -c
          tail -n +2 base-paired.csv | cut -d, -f1 | sort | uniq -c

      # 回归门禁：优先用同机配对结果（head vs base 同一 runner 交替测量）。
      # 只有解析不到 base 版本时才退回绝对基线——绝对基线在共享 runner 上
      # 方差 ~40%，只能当参考。正式 release（prerelease=false）重复跑无害——
      # 同一 commit 结果一致（幂等）；workflow_dispatch 不阻塞。
      - name: Regression gate check
        if: github.event_name == 'pull_request' || github.event_name == 'release'
        env:
          BASE_REF: ${{ steps.base.outputs.ref }}
        run: |
          set -euo pipefail
          if [ -f base-paired.csv ]; then
            rc=0
            python3 scripts/performance/regression_check.py head-paired.csv \
              --compare base-paired.csv --threshold 0.10 > paired-gate.log || rc=$?
            cat paired-gate.log
            {
              echo ""
              echo "### Paired Gate (head vs \`$BASE_REF\`, same runner)"
              echo ""
              echo '```'
              cat paired-gate.log
              echo '```'
              echo ""
            } >> benchmark-results.md
            exit "$rc"
          fi
          echo "WARNING: no base revision measured; gating on absolute baseline"
          python3 scripts/performance/regression_check.py benchmark-raw.csv --threshold 0.10

      - name: Stage logs into workspace
        # upload-artifact keeps absolute paths when the file list has no single
        # workspace root, which produced an artifact nested under
        # home/runner/work/... and tmp/. Copying the server logs in makes the
        # layout flat.
        if: always()
        run: |
          for f in server head-server base-server; do
            [ -f "/tmp/${f}.log" ] && cp "/tmp/${f}.log" "${f}.log" || true
          done
          ls -1 *.log 2>/dev/null || echo "no server logs"

      - name: Upload benchmark results
        # A red gate must still ship its evidence: the paired CSVs are what the
        # verdict table was computed from.
        if: always()
        uses: actions/upload-artifact@v7.0.1
        with:
          name: benchmark-results-${{ github.run_id }}
          path: |
            benchmark-results.md
            benchmark-raw.csv
            benchmark-env.md
            head-paired.csv
            base-paired.csv
            paired-gate.log
            server.log
            head-server.log
            base-server.log
          retention-days: 90

      - name: Comment PR with results
        # always(): a red gate is exactly the run whose report the author needs.
        if: always() && github.event_name == 'pull_request'
        uses: actions/github-script@v9
        with:
          script: |
            const fs = require('fs');
            if (!fs.existsSync('benchmark-results.md')) {
              core.warning('benchmark-results.md missing, skipping PR comment');
              return;
            }
            const results = fs.readFileSync('benchmark-results.md', 'utf8');
            const body = `## 📊 Performance Benchmark Results\n\n${results}\n\n[Full results artifact](https://github.com/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId})`;
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: body
            });

  # 趋势数据只在 pre-release 落库；正式 release 只做门禁校验、不落趋势。
  # This is the only step in the workflow that pushes, so it lives in its own
  # job: the benchmark job builds PR-head code and must keep a read-only
  # contents token. Release events carry maintainer-created tags, so writing
  # here cannot hand a PR author the repository.
  trend:
    if: github.event_name == 'release' && github.event.release.prerelease == true
    needs: benchmark
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write

    steps:
      - name: Checkout main
        uses: actions/checkout@v7.0.1
        with:
          ref: main

      - name: Download benchmark results
        uses: actions/download-artifact@v8.0.1
        with:
          name: benchmark-results-${{ github.run_id }}
          path: run-artifacts

      - name: Commit benchmark trend data
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p docs/benchmark-trends
          DATE=$(date -u +%Y-%m-%d)
          src() { find run-artifacts -name "$1" -print -quit; }
          cp "$(src benchmark-results.md)" "docs/benchmark-trends/benchmark-${DATE}.md"
          cp "$(src benchmark-raw.csv)" "docs/benchmark-trends/benchmark-${DATE}.csv"
          if [ -f "$(src head-paired.csv)" ]; then
            cp "$(src head-paired.csv)" "docs/benchmark-trends/benchmark-${DATE}-head-paired.csv"
            cp "$(src base-paired.csv)" "docs/benchmark-trends/benchmark-${DATE}-base-paired.csv"
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/benchmark-trends/
          if git diff --cached --quiet; then
            echo "No trend changes to commit"
          else
            git commit -m "docs(benchmark): trend data for ${DATE}"
            git push origin HEAD:main
          fi
