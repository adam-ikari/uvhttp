name: CI/CD - Nightly Deep Test

# 触发条件：每日 UTC 0:00 运行，或手动触发
on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:

jobs:
  # ========== 阶段 1: 并行构建和扫描 ==========
  
  ubuntu-build-all:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v7.0.1
        with:
          submodules: recursive
      
      - name: Setup build environment
        uses: ./.github/actions/setup-build
        with:
          os: ubuntu-latest
      
      - name: Cache dependencies
        uses: ./.github/actions/cache-deps
        with:
          cache-key: nightly-${{ github.run_number }}
          build-type: Debug

      - name: Configure CMake with coverage
        run: |
          cmake -B build -DCMAKE_BUILD_TYPE=Debug -DENABLE_COVERAGE=ON -DBUILD_WITH_STATIC_FILES=ON

      - name: Build with coverage
        run: |
          cd build && make -j$(nproc)
      
      - name: Upload build artifacts
        uses: actions/upload-artifact@v7.0.1
        with:
          name: build-ubuntu-nightly-${{ github.run_number }}
          path: build/
          retention-days: 7
  
  code-quality-full:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v7.0.1
        with:
          submodules: recursive
      
      - name: Setup build environment
        uses: ./.github/actions/setup-build
        with:
          os: ubuntu-latest

      - name: Run cppcheck
        run: |
          echo "cppcheck target not available in CMake-generated Makefile"

      - name: Check code formatting
        run: |
          echo "format-check target not available in CMake-generated Makefile"
      
      - name: Upload quality results
        uses: actions/upload-artifact@v7.0.1
        with:
          name: code-quality-results-nightly-${{ github.run_number }}
          path: cppcheck-results.xml
          retention-days: 30
  
  security-scan-full:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      security-events: write   # 上传 CodeQL SARIF 需要

    steps:
      - name: Checkout code
        uses: actions/checkout@v7.0.1
        with:
          submodules: recursive

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: cpp

      - name: Build
        run: make build

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v3
        with:
          output: codeql-results

      - name: Run dependency check
        run: |
          # 检查依赖库版本
          echo "Checking dependencies..."

      - name: Upload security results
        uses: actions/upload-artifact@v7.0.1
        with:
          name: security-results-nightly-${{ github.run_number }}
          path: |
            codeql-results/
            dependency-check-results.txt
          retention-days: 30
  
  # ========== 阶段 2: 完整测试 ==========
  
  ubuntu-test-full:
    needs: [ubuntu-build-all]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      test-status: ${{ steps.test.outputs.status }}
      test-total: ${{ steps.test.outputs.total }}
      test-passed: ${{ steps.test.outputs.passed }}
      test-failed: ${{ steps.test.outputs.failed }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v7.0.1
        with:
          submodules: recursive

      - name: Download build artifacts
        uses: actions/download-artifact@v4.1.2
        with:
          name: build-ubuntu-nightly-${{ github.run_number }}
          path: build/

      - name: Set executable permissions
        run: |
          chmod +x build/dist/bin/* || true

      - name: Run full tests
        id: test
        uses: ./.github/actions/run-tests
        with:
          build-dir: build
          test-type: all
          timeout: 180
          parallel: $(nproc)

      - name: Upload test logs
        if: always()
        uses: actions/upload-artifact@v7.0.1
        with:
          name: test-logs-ubuntu-nightly-${{ github.run_number }}
          path: build/Testing/
          retention-days: 7

  # ========== 阶段 3: 覆盖率报告 ==========

  test-coverage:
    needs: [ubuntu-build-all]
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - name: Checkout code
        uses: actions/checkout@v7.0.1
        with:
          submodules: recursive

      - name: Download build artifacts
        uses: actions/download-artifact@v4.1.2
        with:
          name: build-ubuntu-nightly-${{ github.run_number }}
          path: build/

      - name: Restore executable permission
        run: chmod -R +x build/dist/bin 2>/dev/null || true

      - name: Run tests with coverage
        uses: ./.github/actions/run-tests
        with:
          build-dir: build
          test-type: coverage
          timeout: 120
          parallel: $(nproc)

      - name: Install lcov
        run: sudo apt-get update && sudo apt-get install -y lcov

      - name: Generate coverage report
        run: |
          cd build
          lcov --capture --directory . --output-file coverage.info
          lcov --remove coverage.info '/usr/*' --output-file coverage.info
          lcov --list coverage.info
          genhtml coverage.info --output-directory coverage-report

      - name: Upload coverage report
        uses: actions/upload-artifact@v7.0.1
        with:
          name: coverage-report-nightly-${{ github.run_number }}
          path: build/coverage-report/
          retention-days: 30

      - name: Upload coverage data
        uses: codecov/codecov-action@v4
        with:
          files: build/coverage.info
          flags: nightly
          name: nightly-coverage

  # ========== 阶段 4: 深度测试 ==========

  coverage-report:
    needs: [ubuntu-build-all]
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout code
        uses: actions/checkout@v7.0.1
        with:
          submodules: recursive

      - name: Download build artifacts
        uses: actions/download-artifact@v4.1.2
        with:
          name: build-ubuntu-nightly-${{ github.run_number }}
          path: build/

      - name: Restore executable permission
        run: chmod -R +x build/dist/bin 2>/dev/null || true

      - name: Run tests with coverage
        run: |
          cd build && ctest --output-on-failure

      - name: Upload coverage report
        uses: actions/upload-artifact@v7.0.1
        with:
          name: coverage-report-nightly-${{ github.run_number }}
          path: build/coverage_html/
          retention-days: 30

  test-stress:
    needs: [ubuntu-build-all]
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - name: Checkout code
        uses: actions/checkout@v7.0.1
        with:
          submodules: recursive

      - name: Download build artifacts
        uses: actions/download-artifact@v4.1.2
        with:
          name: build-ubuntu-nightly-${{ github.run_number }}
          path: build/

      - name: Install wrk
        run: |
          sudo apt-get update
          sudo apt-get install -y wrk

      - name: Run stress test
        run: |
          chmod +x build/dist/bin/benchmark_unified

          # 启动服务器
          build/dist/bin/benchmark_unified > /tmp/server.log 2>&1 &
          SERVER_PID=$!
          sleep 3

          # 持续高负载测试（5分钟）
          wrk -t8 -c500 -d300s --timeout 10s http://localhost:18081/ > stress-test.log 2>&1 || true

          kill $SERVER_PID 2>/dev/null || true

      - name: Upload stress test results
        uses: actions/upload-artifact@v7.0.1
        with:
          name: stress-test-results-nightly-${{ github.run_number }}
          path: |
            stress-test.log
            /tmp/server.log
          retention-days: 30

  performance-full:
    needs: [ubuntu-build-all]
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Checkout code
        uses: actions/checkout@v7.0.1
        with:
          submodules: recursive

      - name: Download build artifacts
        uses: actions/download-artifact@v4.1.2
        with:
          name: build-ubuntu-nightly-${{ github.run_number }}
          path: build/

      - name: Install wrk and tools
        run: |
          sudo apt-get update
          sudo apt-get install -y wrk python3 python3-pip
          pip3 install matplotlib numpy

      - name: Run full performance benchmark
        run: |
          chmod +x build/dist/bin/benchmark_unified

          # 启动服务器
          build/dist/bin/benchmark_unified > /tmp/server.log 2>&1 &
          SERVER_PID=$!
          sleep 3

          # 运行多种性能测试场景
          echo "Running performance tests..." > performance.log

          for test_id in 1 2 3 4 5 6 7 8; do
            case $test_id in
              1)
                echo "Test 1: Low Concurrent (10 connections, 30s)" >> performance.log
                wrk -t2 -c10 -d30s --timeout 10s http://localhost:18081/ >> performance.log 2>&1
                ;;
              2)
                echo "Test 2: Medium Concurrent (50 connections, 30s)" >> performance.log
                wrk -t4 -c50 -d30s --timeout 10s http://localhost:18081/ >> performance.log 2>&1
                ;;
              3)
                echo "Test 3: High Concurrent (100 connections, 30s)" >> performance.log
                wrk -t4 -c100 -d30s --timeout 10s http://localhost:18081/ >> performance.log 2>&1
                ;;
              4)
                echo "Test 4: Extreme Concurrent (500 connections, 30s)" >> performance.log
                wrk -t8 -c500 -d30s --timeout 10s http://localhost:18081/ >> performance.log 2>&1
                ;;
              5)
                echo "Test 5: Very High Concurrent (1000 connections, 30s)" >> performance.log
                wrk -t8 -c1000 -d30s --timeout 10s http://localhost:18081/ >> performance.log 2>&1
                ;;
              6)
                echo "Test 6: Sustained Load (100 connections, 60s)" >> performance.log
                wrk -t4 -c100 -d60s --timeout 10s http://localhost:18081/ >> performance.log 2>&1
                ;;
              7)
                echo "Test 7: Small File Transfer" >> performance.log
                wrk -t4 -c50 -d30s --timeout 10s http://localhost:18081/file/small.txt >> performance.log 2>&1
                ;;
              8)
                echo "Test 8: Large File Transfer" >> performance.log
                wrk -t4 -c50 -d30s --timeout 10s http://localhost:18081/file/large.bin >> performance.log 2>&1
                ;;
            esac
            sleep 5
          done

          kill $SERVER_PID 2>/dev/null || true

      - name: Parse performance results
        run: |
          python3 << 'EOF'
          import re
          import json

          results = {}
          current_test = None

          with open('performance.log', 'r') as f:
            for line in f:
              if 'Test ' in line and ':' in line:
                match = re.search(r'Test (\d+):', line)
                if match:
                  current_test = f'test_{match.group(1)}'
                  results[current_test] = {'rps': 0, 'latency': 'N/A'}
              elif 'Requests/sec:' in line and current_test:
                match = re.search(r'Requests/sec:\s+([\d.]+)', line)
                if match:
                  results[current_test]['rps'] = float(match.group(1))
              elif 'Latency' in line and 's' in line and current_test:
                match = re.search(r'Latency\s+([\d.]+[a-z]+)', line)
                if match:
                  results[current_test]['latency'] = match.group(1)

          with open('performance-results.json', 'w') as f:
            json.dump({'results': results}, f, indent=2)

          print(f"parsed={len(results)} tests")
          EOF

      - name: Generate performance trend report
        run: |
          cat > performance-trend.md << 'EOF'
          # Nightly Performance Trend Report

          - **Date**: ${{ github.event.head_commit.timestamp }}
          - **Commit**: ${{ github.sha }}
          - **Run**: #${{ github.run_number }}

          ## Test Results

          | Test | RPS | Latency |
          |------|-----|---------|

          EOF

          # 添加测试结果表格
          python3 << 'EOF'
          import json

          with open('performance-results.json', 'r') as f:
              data = json.load(f)

          test_names = {
              'test_1': 'Low Concurrent (10)',
              'test_2': 'Medium Concurrent (50)',
              'test_3': 'High Concurrent (100)',
              'test_4': 'Extreme Concurrent (500)',
              'test_5': 'Very High Concurrent (1000)',
              'test_6': 'Sustained Load',
              'test_7': 'Small File',
              'test_8': 'Large File'
          }

          with open('performance-trend.md', 'a') as f:
              for test_id, result in data['results'].items():
                  name = test_names.get(test_id, test_id)
                  f.write(f"| {name} | {result['rps']:.2f} | {result['latency']} |\n")
          EOF

      - name: Upload performance artifacts
        uses: actions/upload-artifact@v7.0.1
        with:
          name: performance-full-nightly-${{ github.run_number }}
          path: |
            performance-results.json
            performance-trend.md
            performance.log
          retention-days: 30

  test-memory:
    needs: [ubuntu-build-all]
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout code
        uses: actions/checkout@v7.0.1
        with:
          submodules: recursive

      - name: Download build artifacts
        uses: actions/download-artifact@v4.1.2
        with:
          name: build-ubuntu-nightly-${{ github.run_number }}
          path: build/

      - name: Configure with AddressSanitizer
        run: |
          # Use the project's ENABLE_ASAN option (not raw -fsanitize flags) so
          # CMake keeps debug symbols and does not strip the binaries, making
          # ASan stack traces resolvable.
          cmake -B build-asan -DCMAKE_BUILD_TYPE=Debug -DENABLE_ASAN=ON
          cmake --build build-asan -j$(nproc)

      - name: Run tests with AddressSanitizer
        uses: ./.github/actions/run-tests
        with:
          build-dir: build-asan
          test-type: memory
          timeout: 120
          parallel: 1

      - name: Upload memory test results
        uses: actions/upload-artifact@v7.0.1
        with:
          name: memory-test-results-nightly-${{ github.run_number }}
          path: |
            build-asan/Testing/
          retention-days: 30

  test-ubsan:
    needs: [ubuntu-build-all]
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout code
        uses: actions/checkout@v7.0.1
        with:
          submodules: recursive

      - name: Download build artifacts
        uses: actions/download-artifact@v4.1.2
        with:
          name: build-ubuntu-nightly-${{ github.run_number }}
          path: build/

      - name: Configure with UndefinedBehaviorSanitizer
        run: |
          # UBSan catches undefined behavior (signed overflow, shifts, null
          # deref, alignment, etc.) that ASan does not. ASan and UBSan cannot
          # be combined per CMakeLists.txt, so this is a separate job.
          cmake -B build-ubsan -DCMAKE_BUILD_TYPE=Debug -DENABLE_UBSAN=ON
          cmake --build build-ubsan -j$(nproc)

      - name: Run tests with UndefinedBehaviorSanitizer
        uses: ./.github/actions/run-tests
        with:
          build-dir: build-ubsan
          test-type: all
          timeout: 120
          parallel: 1

      - name: Upload UBSan test results
        uses: actions/upload-artifact@v7.0.1
        with:
          name: ubsan-test-results-nightly-${{ github.run_number }}
          path: |
            build-ubsan/Testing/
          retention-days: 30

  # ========== 阶段 4: 生成总结 ==========
  
  generate-summary:
    needs: [test-coverage, test-memory, test-ubsan, test-stress, performance-full]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    if: always()
    permissions:
      contents: write   # Create nightly release 需要

    steps:
      - name: Checkout code
        uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0

      - name: Generate doc sync status
        run: |
          bash scripts/check-doc-sync.sh

      - name: Generate nightly summary
        run: |
          echo "## 🌙 Nightly Test Report" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Test Status" >> $GITHUB_STEP_SUMMARY
          echo "| Category | Status |" >> $GITHUB_STEP_SUMMARY
          echo "|----------|--------|" >> $GITHUB_STEP_SUMMARY
          echo "| Coverage | ${{ needs.test-coverage.result == 'success' && '✅' || '❌' }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Memory Test | ${{ needs.test-memory.result == 'success' && '✅' || '❌' }} |" >> $GITHUB_STEP_SUMMARY
          echo "| UBSan Test | ${{ needs.test-ubsan.result == 'success' && '✅' || '❌' }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Stress Test | ${{ needs.test-stress.result == 'success' && '✅' || '❌' }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Performance | ${{ needs.performance-full.result == 'success' && '✅' || '❌' }} |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Doc Sync Status" >> $GITHUB_STEP_SUMMARY
          echo "| File | Status |" >> $GITHUB_STEP_SUMMARY
          echo "|------|--------|" >> $GITHUB_STEP_SUMMARY
          for entry in $(python3 -c "import json; d=json.load(open('.vitepress/sync-status.json')); [print(f'{k}|{\"⚠️\" if v[\"outdated\"] else \"✅\"}') for k,v in d.items()]" 2>/dev/null); do
            echo "| $entry |" >> $GITHUB_STEP_SUMMARY
          done
          echo "| Stress Test | ${{ needs.test-stress.result == 'success' && '✅' || '❌' }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Performance | ${{ needs.performance-full.result == 'success' && '✅' || '❌' }} |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Artifacts" >> $GITHUB_STEP_SUMMARY
          echo "- [Coverage Report](https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }})" >> $GITHUB_STEP_SUMMARY
          echo "- [Performance Report](https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }})" >> $GITHUB_STEP_SUMMARY
          echo "- [Memory Test Results](https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }})" >> $GITHUB_STEP_SUMMARY
          echo "- [Stress Test Results](https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }})" >> $GITHUB_STEP_SUMMARY

      - name: Download all artifacts
        run: |
          gh run download ${{ github.run_id }} --pattern "*nightly-${{ github.run_number }}*" -D /tmp/artifacts
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Ensure performance-trend.md exists
        run: |
          TREND=$(find /tmp/artifacts -name performance-trend.md -print -quit 2>/dev/null)
          if [ -n "$TREND" ]; then
            cp "$TREND" ./performance-trend.md
          fi
          if [ ! -f performance-trend.md ]; then
            echo "# Nightly Performance Trend" > performance-trend.md
            echo "" >> performance-trend.md
            echo "（本次 run 未生成趋势数据，见 performance-full job 结果）" >> performance-trend.md
          fi

      - name: Create nightly release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: nightly-${{ github.run_number }}
          name: Nightly Build - ${{ github.event.head_commit.timestamp || github.run_number }}
          body_path: performance-trend.md
          draft: false
          prerelease: true
          files: |
            /tmp/artifacts/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  create-issue-on-failure:
    needs: [ubuntu-build-all, code-quality-full, security-scan-full, ubuntu-test-full, test-coverage, coverage-report, test-stress, performance-full, test-memory, test-ubsan, generate-summary]
    if: always() && (contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled'))
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      issues: write
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Ensure labels exist
        uses: actions/github-script@v7
        with:
          script: |
            const labels = ['nightly', 'bug'];
            for (const l of labels) {
              try { await github.rest.issues.createLabel({ owner: context.repo.owner, repo: context.repo.repo, name: l, color: 'd73a4a' }); }
              catch (e) { if (e.status !== 422) throw e; }  // 422 = already exists
            }
      - name: Create or update nightly failure issue
        uses: actions/github-script@v7
        with:
          script: |
            const failed = ${{ toJSON(needs) }};
            const failedJobs = Object.entries(failed)
              .filter(([,v]) => v.result === 'failure' || v.result === 'cancelled')
              .map(([k]) => k);
            const runUrl = `https://github.com/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const title = `[nightly] CI 失败 ${new Date().toISOString().slice(0,10)}`;
            const body = `Nightly CI 失败 jobs: \`${failedJobs.join(', ')}\`\n\nRun: ${runUrl}\n\n失败原因见上方链接。请修复后合并，下一晚 nightly 自动验证。`;
            // dedup：找 open issue，title 以 "[nightly] CI 失败" 开头且带 nightly label
            const { data: issues } = await github.rest.issues.listForRepo({
              owner: context.repo.owner, repo: context.repo.repo,
              state: 'open', labels: 'nightly', per_page: 100 });
            const existing = issues.find(i => i.title.startsWith('[nightly] CI 失败'));
            if (existing) {
              await github.rest.issues.createComment({ owner: context.repo.owner, repo: context.repo.repo,
                issue_number: existing.number, body: `再次失败 (${new Date().toISOString().slice(0,10)}): ${failedJobs.join(', ')} — ${runUrl}` });
            } else {
              await github.rest.issues.create({ owner: context.repo.owner, repo: context.repo.repo,
                title, body, labels: ['nightly', 'bug'] });
            }
